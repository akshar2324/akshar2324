<svg xmlns="http://www.w3.org/2000/svg" width="880" height="700" viewBox="0 0 880 700">
  <defs>
    <linearGradient id="abg" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#080a12"/>
      <stop offset="50%" stop-color="#0b0d18"/>
      <stop offset="100%" stop-color="#100c1e"/>
    </linearGradient>
    <linearGradient id="av" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a970ff"/>
      <stop offset="100%" stop-color="#6d35ff"/>
    </linearGradient>
    <linearGradient id="av2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a970ff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#6d35ff" stop-opacity="0.4"/>
    </linearGradient>
    <filter id="ag">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="agSoft">
      <feGaussianBlur stdDeviation="12" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="cardShadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#6d35ff" flood-opacity="0.15"/>
    </filter>
    <style>
      .at{font:700 13px 'Segoe UI',system-ui,sans-serif;fill:#fff;letter-spacing:1px}
      .as{font:400 11px 'Segoe UI',system-ui,sans-serif;fill:#9a92b0;letter-spacing:0.5px}
      .ai{font:700 20px 'Segoe UI',system-ui,sans-serif;fill:#fff}
      .ah{font:700 20px 'Segoe UI',system-ui,sans-serif;fill:#a970ff;letter-spacing:2px}
      .ahsub{font:400 12px 'Segoe UI',system-ui,sans-serif;fill:#7a6f96;letter-spacing:1px}
      .connector{stroke:#5d3ab8;stroke-width:2;fill:none;stroke-dasharray:6,4;opacity:0.6}
      .connector-solid{stroke:url(#av2);stroke-width:2.5;fill:none}
      .node-bg{fill:#0e1019;stroke:#3a2878;stroke-width:1.5;rx:14}
      .node-active{fill:#12101f;stroke:#7c52e8;stroke-width:2;rx:14}
    </style>
  </defs>

  <!-- Background -->
  <rect width="880" height="700" rx="20" fill="url(#abg)"/>

  <!-- Subtle grid -->
  <g opacity="0.025" stroke="#a970ff" stroke-width="0.5">
    <line x1="0" y1="0" x2="0" y2="700"/><line x1="88" y1="0" x2="88" y2="700"/>
    <line x1="176" y1="0" x2="176" y2="700"/><line x1="264" y1="0" x2="264" y2="700"/>
    <line x1="352" y1="0" x2="352" y2="700"/><line x1="440" y1="0" x2="440" y2="700"/>
    <line x1="528" y1="0" x2="528" y2="700"/><line x1="616" y1="0" x2="616" y2="700"/>
    <line x1="704" y1="0" x2="704" y2="700"/><line x1="792" y1="0" x2="792" y2="700"/>
    <line x1="880" y1="0" x2="880" y2="700"/>
    <line x1="0" y1="0" x2="880" y2="0"/><line x1="0" y1="100" x2="880" y2="100"/>
    <line x1="0" y1="200" x2="880" y2="200"/><line x1="0" y1="300" x2="880" y2="300"/>
    <line x1="0" y1="400" x2="880" y2="400"/><line x1="0" y1="500" x2="880" y2="500"/>
    <line x1="0" y1="600" x2="880" y2="600"/><line x1="0" y1="700" x2="880" y2="700"/>
  </g>

  <!-- Ambient orbs -->
  <circle cx="120" cy="120" r="120" fill="url(#orb1)" opacity="0.15">
    <animate attributeName="r" values="120;140;120" dur="8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="760" cy="580" r="100" fill="#6d35ff" opacity="0.06">
    <animate attributeName="r" values="100;120;100" dur="10s" repeatCount="indefinite"/>
  </circle>
  <circle cx="440" cy="350" r="200" fill="#a970ff" opacity="0.02"/>

  <!-- Header -->
  <text x="440" y="46" text-anchor="middle" class="ah">SYSTEM ARCHITECTURE</text>
  <text x="440" y="66" text-anchor="middle" class="ahsub">The layers I connect — from hardware to automation</text>

  <!-- ========== VERTICAL FLOW ========== -->

  <!-- CONNECTORS (drawn first so nodes sit on top) -->
  <!-- Hardware → Embedded -->
  <path d="M440 170 L440 196" class="connector-solid" filter="url(#ag)"/>
  <!-- Embedded → Applications -->
  <path d="M440 268 L440 296" class="connector-solid" filter="url(#ag)"/>
  <!-- Applications → Backend -->
  <path d="M440 368 L440 396" class="connector-solid" filter="url(#ag)"/>
  <!-- Backend → AI / Data -->
  <path d="M440 468 L440 496" class="connector-solid" filter="url(#ag)"/>
  <!-- AI/Data → Infrastructure -->
  <path d="M440 568 L440 596" class="connector-solid" filter="url(#ag)"/>

  <!-- Animated pulses on connectors -->
  <circle r="3" fill="#a970ff" filter="url(#ag)">
    <animateMotion dur="2s" repeatCount="indefinite" path="M440,170 L440,196"/>
  </circle>
  <circle r="3" fill="#a970ff" filter="url(#ag)">
    <animateMotion dur="2s" repeatCount="indefinite" begin="0.4s" path="M440,268 L440,296"/>
  </circle>
  <circle r="3" fill="#a970ff" filter="url(#ag)">
    <animateMotion dur="2s" repeatCount="indefinite" begin="0.8s" path="M440,368 L440,396"/>
  </circle>
  <circle r="3" fill="#a970ff" filter="url(#ag)">
    <animateMotion dur="2s" repeatCount="indefinite" begin="1.2s" path="M440,468 L440,496"/>
  </circle>
  <circle r="3" fill="#a970ff" filter="url(#ag)">
    <animateMotion dur="2s" repeatCount="indefinite" begin="1.6s" path="M440,568 L440,596"/>
  </circle>

  <!-- ========== NODE 1: HARDWARE ========== -->
  <rect x="170" y="96" width="540" height="74" class="node-active" filter="url(#cardShadow)"/>
  <circle cx="210" cy="133" r="18" fill="#1a1530" stroke="url(#av)" stroke-width="2"/>
  <text x="210" y="139" text-anchor="middle" class="ai">⚙</text>
  <text x="244" y="126" class="at">HARDWARE</text>
  <text x="244" y="146" class="as">Raspberry Pi · ESP32 · Cameras · Sensors · IoT Devices</text>

  <!-- ========== NODE 2: EMBEDDED ========== -->
  <rect x="170" y="196" width="540" height="72" class="node-bg" filter="url(#cardShadow)"/>
  <circle cx="210" cy="232" r="18" fill="#1a1530" stroke="#5d3ab8" stroke-width="1.5"/>
  <text x="210" y="238" text-anchor="middle" class="ai">⌨</text>
  <text x="244" y="225" class="at">EMBEDDED SOFTWARE</text>
  <text x="244" y="245" class="as">Embedded Linux · C/C++ · Device Drivers · Serial · GPIO</text>

  <!-- ========== NODE 3: APPLICATIONS ========== -->
  <rect x="170" y="296" width="540" height="72" class="node-active" filter="url(#cardShadow)"/>
  <circle cx="210" cy="332" r="18" fill="#1a1530" stroke="url(#av)" stroke-width="2"/>
  <text x="210" y="338" text-anchor="middle" class="ai">📱</text>
  <text x="244" y="325" class="at">APPLICATIONS</text>
  <text x="244" y="345" class="as">Android · Kotlin · Flutter · React · Three.js · UI/UX</text>

  <!-- ========== NODE 4: BACKEND ========== -->
  <rect x="170" y="396" width="540" height="72" class="node-bg" filter="url(#cardShadow)"/>
  <circle cx="210" cy="432" r="18" fill="#1a1530" stroke="#5d3ab8" stroke-width="1.5"/>
  <text x="210" y="438" text-anchor="middle" class="ai">⚡</text>
  <text x="244" y="425" class="at">BACKEND &amp; DATA</text>
  <text x="244" y="445" class="as">Python · Flask · PostgreSQL · Redis · Celery · REST APIs</text>

  <!-- ========== NODE 5: AI / DATA ========== -->
  <rect x="170" y="496" width="540" height="72" class="node-active" filter="url(#cardShadow)"/>
  <circle cx="210" cy="532" r="18" fill="#1a1530" stroke="url(#av)" stroke-width="2"/>
  <text x="210" y="538" text-anchor="middle" class="ai">🧠</text>
  <text x="244" y="525" class="at">AI &amp; COMPUTER VISION</text>
  <text x="244" y="545" class="as">PyTorch · OpenCV · Inference Pipelines · Image Processing</text>

  <!-- ========== NODE 6: INFRASTRUCTURE ========== -->
  <rect x="170" y="596" width="540" height="72" class="node-bg" filter="url(#cardShadow)"/>
  <circle cx="210" cy="632" r="18" fill="#1a1530" stroke="#5d3ab8" stroke-width="1.5"/>
  <text x="210" y="638" text-anchor="middle" class="ai">☁</text>
  <text x="244" y="625" class="at">INFRASTRUCTURE &amp; AUTOMATION</text>
  <text x="244" y="645" class="as">Linux · Docker · Networking · WireGuard · CI/CD · GitHub Actions</text>

  <!-- Side labels -->
  <text x="146" y="133" text-anchor="end" class="ahsub" opacity="0.5">01</text>
  <text x="146" y="232" text-anchor="end" class="ahsub" opacity="0.5">02</text>
  <text x="146" y="332" text-anchor="end" class="ahsub" opacity="0.5">03</text>
  <text x="146" y="432" text-anchor="end" class="ahsub" opacity="0.5">04</text>
  <text x="146" y="532" text-anchor="end" class="ahsub" opacity="0.5">05</text>
  <text x="146" y="632" text-anchor="end" class="ahsub" opacity="0.5">06</text>

  <!-- Right-side flow arrows -->
  <text x="734" y="190" class="ahsub" opacity="0.3" font-size="16">↓</text>
  <text x="734" y="290" class="ahsub" opacity="0.3" font-size="16">↓</text>
  <text x="734" y="390" class="ahsub" opacity="0.3" font-size="16">↓</text>
  <text x="734" y="490" class="ahsub" opacity="0.3" font-size="16">↓</text>
  <text x="734" y="590" class="ahsub" opacity="0.3" font-size="16">↓</text>
</svg>