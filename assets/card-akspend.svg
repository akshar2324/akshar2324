<svg xmlns="http://www.w3.org/2000/svg" width="420" height="240" viewBox="0 0 420 240">
  <defs>
    <linearGradient id="cbg1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0e1019"/>
      <stop offset="100%" stop-color="#12101f"/>
    </linearGradient>
    <linearGradient id="cv1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a970ff"/>
      <stop offset="100%" stop-color="#6d35ff"/>
    </linearGradient>
    <filter id="cg1">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .ct{font:700 18px 'Segoe UI',system-ui,sans-serif;fill:#fff}
      .ctag{font:600 10px 'Segoe UI',system-ui,sans-serif;fill:#a970ff;letter-spacing:1.5px}
      .cd{font:400 12px 'Segoe UI',system-ui,sans-serif;fill:#9a92b0;line-height:1.5}
      .cf{font:400 11px 'Segoe UI',system-ui,sans-serif;fill:#7a6f96}
      .clink{font:600 11px 'Segoe UI',system-ui,sans-serif;fill:#a970ff;letter-spacing:1px}
    </style>
  </defs>

  <rect width="420" height="240" rx="16" fill="url(#cbg1)" stroke="#2a1f4e" stroke-width="1.5"/>
  
  <!-- Accent corner -->
  <rect x="0" y="0" width="4" height="240" rx="2" fill="url(#cv1)" opacity="0.6"/>

  <!-- Icon -->
  <circle cx="42" cy="42" r="20" fill="#1a1530" stroke="#7c52e8" stroke-width="1.5"/>
  <text x="42" y="49" text-anchor="middle" font-size="18">💰</text>

  <!-- Title -->
  <text x="74" y="38" class="ctag">PERSONAL FINANCE</text>
  <text x="74" y="56" class="ct">AkSpend</text>

  <!-- Description -->
  <text x="28" y="88" class="cd">Private, offline-first personal finance manager</text>
  <text x="28" y="104" class="cd">built around encrypted local data.</text>

  <!-- Features -->
  <circle cx="36" cy="130" r="3" fill="#a970ff" filter="url(#cg1)"/>
  <text x="46" y="134" class="cf">Encrypted local storage</text>
  <circle cx="36" cy="150" r="3" fill="#a970ff" filter="url(#cg1)"/>
  <text x="46" y="154" class="cf">Multi-currency · Budgets · CSV export</text>
  <circle cx="36" cy="170" r="3" fill="#a970ff" filter="url(#cg1)"/>
  <text x="46" y="174" class="cf">Offline-first · Reports &amp; analytics</text>

  <!-- Tech badges -->
  <rect x="28" y="194" width="56" height="20" rx="6" fill="#1a1530" stroke="#3a2878" stroke-width="1"/>
  <text x="56" y="208" text-anchor="middle" class="cf" fill="#b792ff" font-size="10">Android</text>
  <rect x="92" y="194" width="50" height="20" rx="6" fill="#1a1530" stroke="#3a2878" stroke-width="1"/>
  <text x="117" y="208" text-anchor="middle" class="cf" fill="#b792ff" font-size="10">Kotlin</text>
  <rect x="150" y="194" width="58" height="20" rx="6" fill="#1a1530" stroke="#3a2878" stroke-width="1"/>
  <text x="179" y="208" text-anchor="middle" class="cf" fill="#b792ff" font-size="10">SQLite</text>

  <!-- Link -->
  <text x="348" y="226" text-anchor="end" class="clink">VIEW PROJECT →</text>
</svg>
