  <text x="28" y="88" class="cd3">A long-running coding challenge focused on</text>
  <text x="28" y="104" class="cd3">learning by building across multiple languages.</text>

  <circle cx="36" cy="130" r="3" fill="#a970ff" filter="url(#cg3)"/>
  <text x="46" y="134" class="cf3">Daily coding challenges</text>
  <circle cx="36" cy="150" r="3" fill="#a970ff" filter="url(#cg3)"/>
  <text x="46" y="154" class="cf3">Cross-language exploration</text>
  <circle cx="36" cy="170" r="3" fill="#a970ff" filter="url(#cg3)"/>
  <text x="46" y="174" class="cf3">Building discipline through practice</text>

  <rect x="28" y="194" width="52" height="20" rx="6" fill="#1a1530" stroke="#3a2878" stroke-width="1"/>
  <text x="54" y="208" text-anchor="middle" class="cf3" fill="#b792ff" font-size="10">Python</text>
  <rect x="88" y="194" width="42" height="20" rx="6" fill="#1a1530" stroke="#3a2878" stroke-width="1"/>
  <text x="109" y="208" text-anchor="middle" class="cf3" fill="#b792ff" font-size="10">Java</text>
  <rect x="138" y="194" width="50" height="20" rx="6" fill="#1a1530" stroke="#3a2878" stroke-width="1"/>
  <text x="163" y="208" text-anchor="middle" class="cf3" fill="#b792ff" font-size="10">Kotlin</text>
  <rect x="196" y="194" width="52" height="20" rx="6" fill="#1a1530" stroke="#3a2878" stroke-width="1"/>
  <text x="222" y="208" text-anchor="middle" class="cf3" fill="#b792ff" font-size="10">Flutter</text>

